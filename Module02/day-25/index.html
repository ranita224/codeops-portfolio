<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ethiopia-weather</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Ethiopia Weather</h1>
    <input id="search" placeholder="Search city…" />
  </header>

  <main>
    <section id="cities" aria-label="Weather list"></section>
    <aside id="saved" aria-label="Saved favourites"></aside>
  </main>

  <section id="subscribe-section">
    <h2>Subscribe for Weather Alerts</h2>
    <form id="subscribe" novalidate>
      <label for="subscriber-name">Name</label>
      <input id="subscriber-name" type="text" required autocomplete="name" />

      <label for="subscriber-phone">Phone (for SMS alerts)</label>
      <input id="subscriber-phone" type="tel" placeholder="09xxxxxxxx" autocomplete="tel" />

      <label for="subscriber-city">City</label>
      <select id="subscriber-city" autocomplete="off">
        <option value="">Select city</option>
        <option>Addis Abeba</option>
        <option>Bole</option>
        <option>Dire Dawa</option>
        <option>Mekelle</option>
        <option>Hawassa</option>
        <option>Bahir Dar</option>
        <option>Jimma</option>
        <option>Shashemene</option>
        <option>Gondar</option>
        <option>Debre Markos</option>
        <option>Arba Minch</option>
        <option>Adama</option>
        <option>Harar</option>
      </select>

      <p id="form-error" class="error" aria-live="polite"></p>
      <button type="submit">Subscribe</button>
    </form>
  </section>

  <footer>
    <p>Ethiopia · Weather App</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
