<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ethio Telecom Dashboard Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="page">
  <header class="header">
    <div class="logo">Ethio Telecom</div>
    <nav class="nav">
      <a href="#">Home</a>
      <a href="#">Services</a>
      <a href="#">Support</a>
      <a href="#">Login</a>
    </nav>
  </header>
  <aside class="sidebar">
    <ul>
      <li>Dashboard</li>
      <li>Account</li>
      <li>Payments</li>
      <li>Settings</li>
    </ul>
  </aside>
  <main class="main">
    <h2>Account Overview</h2>
    <section class="cards">
      <div class="card">
        <h3>Balance</h3>
        <p>ETB 1,250</p>
        <div class="badge">Updated</div>
      </div>
      <div class="card">
        <h3>Data Usage</h3>
        <p>3.2 GB / 10 GB</p>
      </div>
      <div class="card">
        <h3>Voice Minutes</h3>
        <p>120 / 300 min</p>
      </div>
    </section>
  </main>
  <footer class="footer">
    <p>© 2026 Ethio Telecom | All Rights Reserved</p>
  </footer>
</body>
</html>
