<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 14 Exercises</title>
    <!-- Linking external stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Question 1: Navbar with Flexbox -->
    <nav class="navbar">
    <div class="logo">MySite</div>
    <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
        <button>Sign Up</button>
    </div>
    </nav>

    <!-- Question 2: Row of four cards -->
    <section class="card-row">
    <div class="card">Card 1</div>
    <div class="card">Card 2</div>
    <div class="card">Card 3</div>
    <div class="card">Card 4</div>
    </section>

    <!-- Question 3: Photo gallery grid -->
    <section class="gallery">
    <img src="land.webp" alt="Women dancing in traditional Ethiopian attire">
    <img src="ethio.jpg" alt="Family sharing traditional Ethiopian food">
    <img src="ethiofood.webp" alt="Ethiopian injera platter with assorted dishes">
    <img src="cloths.webp" alt="Woman wearing traditional Habesha dress">

    </section>

    <!-- Question 4: Full page layout with grid-template-areas -->
    <section class="page-layout">
    <header>Header</header>
    <aside>Sidebar</aside>
    <main>Main Content</main>
    <footer>Footer</footer>
    </section>

    <!-- Question 5: Product card with pinned badge -->
    <div class="product-card">
    <div class="badge">ETB Sale</div>
    <h3>Product Name</h3>
    <p>Short product description goes here, highlighting key features or price.</p>
    </div>

</body>
</html>
