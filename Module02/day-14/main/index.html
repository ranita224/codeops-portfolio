<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habesha Eatery Landing Page</title>
  <link rel="stylesheet" href="layout.css">
</head>
<body class="page">
  <nav class="navbar">
    <div class="logo">Habesha Eatery</div>
    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">Menu</a>
      <a href="#">Contact</a>
    </div>
  </nav>
  <section class="menu">
    <div class="card">
      <img src="ethiofood.webp" alt="Traditional Ethiopian dish">
      <h3>Doro Wat</h3>
      <p>Spicy chicken stew served with injera.</p>
      <div class="price">ETB 3250</div>
      <div class="badge">Popular</div>
    </div>

    <div class="card">
      <img src="food.webp" alt="Vegetarian platter">
      <h3>Vegetarian Combo</h3>
      <p>Assorted lentils and greens with injera.</p>
      <div class="price">ETB 1800</div>
    </div>

    <div class="card">
      <img src="ethiopian- traditional-food.jpg" alt="Beef tibs dish">
      <h3>Beef Tibs</h3>
      <p>Pan‑fried beef cubes with spices.</p>
      <div class="price">ETB 2200</div>
    </div>
  </section>
  <footer class="footer">
    <p>© 2026 Habesha Eatery | Authentic Taste of Ethiopia</p>
  </footer>

</body>
</html>
