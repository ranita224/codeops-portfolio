<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <title>Addis Market List</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <h1>Addis Market Shopping List</h1>
        <!-- Form to add grocery items -->
        <form id="add-form">
            <input id="item-input" placeholder="e.g. Teff" />
            <button type="submit">Add</button>
        </form>

        <!-- Paragraph for the live item counter -->
        <p id="item-count">0 items</p>

        <!-- Empty list to be populated by JavaScript -->
        <ul id="item-list"></ul>

        <script src="app.js"></script>
    </body>

</html>
